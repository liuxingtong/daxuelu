<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>四维筛选 · 胁迫因子 × 环境因子 × 干预策略 × 空间对象（含知识卡）</title>
<style>
:root{--bg:#fff;--soft:#f6f7f9;--line:#e3e6ea;--ink:#1c2024;--ink2:#5b6470;--ink3:#8b95a1;
--blue:#185fa5;--blue50:#e6f1fb;--blue800:#0c447c;
--teal:#0f6e56;--teal50:#e1f5ee;--teal800:#085041;
--amber:#854f0b;--amber50:#faeeda;--amberline:#ba7515;--amber800:#633806;
--purple:#534ab7;--purple50:#eeedfe;--purple800:#26215c;
--red:#a32d2d;--red50:#fcebeb;--redline:#e24b4a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-size:13.5px;line-height:1.7;
font-family:"Microsoft YaHei","PingFang SC","Hiragino Sans GB",-apple-system,"Segoe UI",sans-serif}
header{padding:16px 22px 10px;border-bottom:1px solid var(--line);position:sticky;top:0;
background:rgba(255,255,255,.97);backdrop-filter:blur(8px);z-index:30}
h1{margin:0 0 2px;font-size:17px;font-weight:600}
.sub{color:var(--ink3);font-size:12px}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.bar input[type=search]{flex:0 1 200px;padding:5px 10px;border:1px solid var(--line);
border-radius:8px;font-size:12.5px;font-family:inherit;outline:none}
.bar input:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue50)}
.bar button{padding:5px 11px;border:1px solid var(--line);background:#fff;border-radius:8px;
font-size:12px;font-family:inherit;color:var(--ink2);cursor:pointer}
.bar button:hover{border-color:var(--blue);color:var(--blue);background:var(--blue50)}
.bar button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.bar button.knb{border-color:var(--teal);color:var(--teal800);background:var(--teal50);font-weight:600}
.bar button.knb:hover{background:var(--teal);color:#fff}
.bar label{font-size:12px;color:var(--ink2);user-select:none;display:flex;gap:4px;align-items:center}
.sep{width:1px;height:20px;background:var(--line);margin:0 2px}
.langs{display:flex;gap:0}
.langs button{border-radius:0;padding:5px 9px;margin:0}
.langs button:first-child{border-radius:8px 0 0 8px}
.langs button:last-child{border-radius:0 8px 8px 0;border-left:none}
.crumb{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:9px;font-size:12px;color:var(--ink3)}
.crumb .chip{background:var(--blue50);color:var(--blue800);border:1px solid var(--blue);
border-radius:20px;padding:1px 9px;cursor:pointer;font-size:11.5px}
.crumb .chip:hover{background:var(--red50);border-color:var(--redline);color:var(--red)}
.crumb .chip.m{background:var(--purple50);color:var(--purple800);border-color:var(--purple)}
.crumb .chip.g{background:var(--teal50);color:var(--teal800);border-color:var(--teal)}
.crumb .chip.o{background:var(--amber50);color:var(--amber800);border-color:var(--amberline)}
main{display:grid;grid-template-columns:1fr 1fr 1fr 1fr 1.5fr;height:calc(100vh - 150px);overflow:hidden}
/* 收起左四列：结果列独占，并限制最大宽度避免行太长 */
main.foldf{grid-template-columns:minmax(0,1fr)}
main.foldf .col-f{display:none}
main.foldf .col[data-col="res"]{max-width:1340px;margin:0 auto;border-right:none}
.col{border-right:1px solid var(--line);overflow-y:auto;padding:10px 9px 70px}
.col:last-child{border-right:none;background:#fcfcfd}
.ch{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;
margin:0 0 8px;padding:6px 8px;border-radius:8px;background:var(--soft);cursor:pointer;user-select:none}
.ch .tri{font-size:9px;color:var(--ink3);transition:transform .15s}
.col.fold .tri{transform:rotate(-90deg)}
.col.fold .cbody{display:none}
.ch .n{margin-left:auto;font-weight:400;color:var(--ink3);font-size:11.5px}
.col-s .ch{color:var(--blue800)} .col-g .ch{color:var(--teal800)} .col-m .ch{color:var(--purple800)}
.col-o .ch{color:var(--amber800)}
.col-o .opt.on{background:var(--amber50);color:var(--amber800);border-left-color:var(--amberline)}
.col-o .opt.on .bx{background:var(--amberline);border-color:var(--amberline)}
.col-o .opt.on .lb em{color:var(--amber800)}
.col-o .opt .nq{font-size:10px;color:var(--teal800);background:var(--teal50);
border:1px solid var(--teal);border-radius:8px;padding:0 5px;margin-left:2px}
/* —— 第 3 维「引导」的通道 × 场景 二级面板 —— */
.gpanel{margin:3px 0 7px 10px;padding:7px 8px;border:1px dashed var(--purple);border-radius:8px;
background:var(--purple50)}
.gpanel .gl{font-size:10.5px;color:var(--purple800);font-weight:600;display:block;margin:0 0 3px}
.gpanel .gl+ .gc{margin-bottom:6px}
.gc{display:inline-block;font-size:10.5px;border:1px solid var(--purple);background:#fff;
color:var(--purple800);border-radius:9px;padding:0 7px;margin:0 4px 4px 0;cursor:pointer;user-select:none}
.gc:hover{background:var(--purple);color:#fff}
.gc.on{background:var(--purple);border-color:var(--purple);color:#fff;font-weight:600}
.gc.off{background:#f2f2f4;border-color:var(--line);color:var(--ink3);cursor:not-allowed;text-decoration:line-through}
.gc.off:hover{background:#f2f2f4;color:var(--ink3)}
.gc i{font-style:normal;opacity:.85;margin-left:3px}
/* —— 附注区（不参与筛选）—— */
.notesec{margin:12px 0 0;border-top:1px dashed var(--line);padding-top:8px}
.notebtn{display:flex;align-items:center;gap:6px;width:100%;font-size:11.5px;font-weight:600;
color:var(--ink2);background:var(--soft);border:1px solid var(--line);border-radius:8px;
padding:5px 8px;cursor:pointer;font-family:inherit;text-align:left}
.notebtn:hover{border-color:var(--blue);color:var(--blue)}
.notebtn .tri{font-size:9px;transition:transform .15s}
.notebtn.open .tri{transform:rotate(90deg)}
.notebody{margin-top:6px}
.nrow{font-size:11.5px;color:var(--ink2);padding:3px 8px;border-left:2px solid var(--line);
margin-bottom:3px;background:#fbfbfc}
.nrow b{color:var(--ink);font-weight:600}
.nrow em{font-style:normal;color:var(--ink3);display:block;font-size:10.5px}
.opt{display:flex;align-items:center;gap:7px;padding:4px 8px;border-radius:7px;cursor:pointer;
font-size:12.5px;color:var(--ink2);border-left:2px solid transparent}
.opt:hover{background:var(--soft)}
.opt.on{background:var(--blue50);color:var(--blue800);border-left-color:var(--blue)}
.col-g .opt.on{background:var(--teal50);color:var(--teal800);border-left-color:var(--teal)}
.col-m .opt.on{background:var(--purple50);color:var(--purple800);border-left-color:var(--purple)}
.opt .bx{width:13px;height:13px;flex:none;border:1px solid var(--line);border-radius:4px;
background:#fff;position:relative}
.opt.on .bx{background:var(--blue);border-color:var(--blue)}
.col-g .opt.on .bx{background:var(--teal);border-color:var(--teal)}
.col-m .opt.on .bx{background:var(--purple);border-color:var(--purple)}
.opt.on .bx::after{content:"";position:absolute;left:3.5px;top:1px;width:4px;height:7px;
border-right:1.6px solid #fff;border-bottom:1.6px solid #fff;transform:rotate(40deg)}
.opt .lb{display:flex;flex-direction:column;line-height:1.35;min-width:0}
.opt .lb em{font-style:normal;font-size:11px;color:var(--ink3)}
.opt.on .lb em{color:var(--blue800);opacity:.75}
.col-g .opt.on .lb em{color:var(--teal800)}
.col-m .opt.on .lb em{color:var(--purple800)}
.opt .c{margin-left:auto;font-size:11px;color:var(--ink3);flex:none;font-variant-numeric:tabular-nums}
.opt.zero .c{color:var(--amberline)}
.opt.dim{opacity:.42}
.opt .kind{font-size:10px;color:var(--ink3);border:1px solid var(--line);border-radius:8px;padding:0 5px}
/* 知识卡入口徽标 */
.knb-ico{flex:none;font-size:10px;line-height:1.5;padding:0 5px;border-radius:8px;cursor:pointer;
border:1px solid var(--teal);background:var(--teal50);color:var(--teal800);
font-variant-numeric:tabular-nums;white-space:nowrap}
.knb-ico:hover{background:var(--teal);color:#fff}
.opt.on .knb-ico{border-color:var(--teal);background:#fff}
/* 小项行 */
.kni{display:flex;align-items:center;gap:6px;padding:2px 8px 2px 31px;font-size:11.5px;
color:var(--ink3);line-height:1.5}
.kni .dot{width:5px;height:5px;border-radius:50%;flex:none;background:transparent;border:1px solid var(--line);align-self:flex-start;margin-top:5px}
.kni .klb{flex:1;min-width:0}
.kni em{font-style:normal;font-size:10.5px;color:var(--ink3);margin-left:4px}
.kni.has em{color:var(--teal800);opacity:.7}
.kni.has{color:var(--teal800);cursor:pointer}
.kni.has .dot{background:var(--teal);border-color:var(--teal)}
.kni.has:hover{background:var(--teal50);border-radius:6px}
.kni .star{color:var(--amberline);font-size:10px}
.ksep{margin:6px 0 1px;font-size:11px;font-weight:600;color:var(--ink3);padding:0 8px 0 31px}
.ksep em{font-style:normal;font-weight:400;font-size:10px;color:var(--ink3);margin-left:4px}
.sub2{font-size:11px;color:var(--ink3);padding:0 8px 4px 31px;line-height:1.5}
.tabs{display:flex;gap:6px;margin:0 0 10px}
.tabs button{flex:1;padding:6px 4px;border:1px solid var(--line);background:#fff;border-radius:8px;
font-size:12px;font-family:inherit;color:var(--ink2);cursor:pointer}
.tabs button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.tabs button span{opacity:.75;font-size:11px}
.res{max-width:100%}
.cc{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 8px;background:#fff}
.cc .t{font-size:13.5px;font-weight:600;color:var(--blue800);margin-bottom:2px}
.cc .t em{font-style:normal;font-weight:400;font-size:11.5px;color:var(--ink3)}
.cc .md{font-size:11.5px;color:var(--ink3);margin-bottom:5px}
.cc .tags{margin-bottom:4px}
.tg{display:inline-block;font-size:10.5px;border-radius:9px;padding:0 6px;margin:0 4px 3px 0;
border:1px solid var(--line);color:var(--ink3)}
.tg.s{background:var(--amber50);border-color:var(--amberline);color:var(--amber)}
.tg.m{background:var(--purple50);border-color:var(--purple);color:var(--purple800)}
.tg.g{background:var(--teal50);border-color:var(--teal);color:var(--teal800)}
.cc .kv{font-size:11.5px;color:var(--ink2);margin-top:4px}
.cc .kv i{color:var(--ink3);font-style:normal}
.cc .sum{font-size:12.5px;line-height:1.66;background:#fbfcfe;border-left:2px solid var(--blue);
padding:7px 11px;margin:6px 0 2px;border-radius:0 7px 7px 0}
.cc .sum.ensum{border-left-color:var(--teal);background:#f8fcfb;font-family:"Segoe UI",
-apple-system,"Helvetica Neue",sans-serif;font-size:12px;line-height:1.62}
.cc .sum b{color:var(--blue800);font-weight:600}
.cc .lab{font-size:10.5px;color:var(--ink3);margin-top:6px;letter-spacing:.02em}
.badge-new{background:var(--amber50);border:1px solid var(--amberline);color:var(--amber);
font-size:10px;border-radius:9px;padding:0 6px;margin-left:6px;vertical-align:1px}
.badge-gap{background:var(--teal50);border:1px solid var(--teal);color:var(--teal800);
font-size:10px;border-radius:9px;padding:0 6px;margin-left:6px;vertical-align:1px}
.badge-sense{background:var(--purple50);border:1px solid var(--purple);color:var(--purple800);
font-size:10px;border-radius:9px;padding:0 6px;margin-left:6px;vertical-align:1px}
.badge-kn{background:#fff;border:1px solid var(--teal);color:var(--teal800);
font-size:10px;border-radius:9px;padding:0 6px;margin-left:6px;vertical-align:1px}
.cc a{color:var(--blue);text-decoration:none;border-bottom:1px dotted var(--blue);font-size:11.5px}
.mrow{display:flex;align-items:baseline;gap:7px;padding:6px 9px;border-radius:7px;cursor:pointer;
font-size:12.5px;color:var(--ink2);border:1px solid transparent}
.mrow:hover{background:var(--soft);border-color:var(--line)}
.mrow b{color:var(--purple800);font-weight:600}
.mrow em{font-style:normal;color:var(--ink3);font-size:11.5px}
.mrow .n{margin-left:auto;font-size:11px;color:var(--ink3);flex:none}
.empty{color:var(--ink3);font-size:12.5px;padding:14px 6px}
.hint{background:var(--amber50);border:1px solid var(--amberline);border-radius:9px;
padding:9px 12px;color:var(--amber);font-size:12px;margin:0 0 10px}
.hint b{font-weight:600}
/* 搜索结果提示条 */
.qbar{background:var(--teal50);border:1px solid var(--teal);border-radius:9px;padding:7px 11px;
color:var(--teal800);font-size:12px;margin:0 0 10px;display:flex;align-items:center;gap:6px;
flex-wrap:wrap}
.qbar b{font-weight:600}
.qbar em{font-style:normal;color:var(--teal800);opacity:.75;font-size:11px}
.qbar button{margin-left:auto;padding:3px 10px;border:1px solid var(--teal);background:#fff;
border-radius:7px;font-size:11.5px;font-family:inherit;color:var(--teal800);cursor:pointer}
.qbar button:hover{background:var(--teal);color:#fff}

/* ============ 空间矩阵（机制轴） ============ */
.mxwrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:#fff}
table.mx{border-collapse:collapse;font-size:12px;width:100%;min-width:1080px}
table.mx th{position:sticky;top:0;z-index:2;background:#f3f6f9;text-align:left;
padding:8px 10px;font-size:11.5px;font-weight:600;color:var(--ink2);
border-bottom:1px solid var(--line);white-space:nowrap}
table.mx th em{font-style:normal;font-weight:400;font-size:10.5px;color:var(--ink3);display:block}
table.mx td{padding:8px 10px;border-bottom:1px solid #eef1f4;vertical-align:top;line-height:1.6}
table.mx tr:hover td{background:#fafcfe}
table.mx tr.mxhl td{background:var(--teal50)}
table.mx td.obj{font-weight:600;color:var(--teal800);min-width:118px;position:sticky;left:0;
background:#fff;z-index:1;border-right:1px solid var(--line)}
table.mx tr:hover td.obj{background:#fafcfe}
table.mx tr.mxhl td.obj{background:var(--teal50)}
table.mx td.obj em{display:block;font-style:normal;font-weight:400;font-size:10.5px;color:var(--ink3)}
table.mx td.obj .sub2{padding:2px 0 0;font-size:11px;color:var(--ink3);line-height:1.5}
.pchip{display:inline-block;font-size:10.5px;border-radius:8px;padding:1px 6px;margin:0 4px 3px 0;
border:1px solid var(--line);color:var(--ink2);background:#fff;white-space:nowrap}
.pchip.rt{border-color:var(--teal);background:var(--teal50);color:var(--teal800)}
.pchip.dz{border-color:var(--line);background:#f6f7f9;color:var(--ink3)}
.pchip em{font-style:normal;color:var(--ink3);font-size:10px;margin-left:3px}
.pchip.rt em{color:var(--teal800);opacity:.7}
.adjust{font-size:10.5px;color:var(--ink3);margin-top:3px;font-variant-numeric:tabular-nums}
.adjust b{color:var(--teal800);font-weight:600}
.mlink{display:inline-block;font-size:11px;border:1px solid var(--purple);background:var(--purple50);
color:var(--purple800);border-radius:8px;padding:1px 7px;margin:0 4px 3px 0;cursor:pointer}
.mlink:hover{background:var(--purple);color:#fff}
.clink{display:inline-block;font-size:11px;border:1px solid var(--blue);background:var(--blue50);
color:var(--blue800);border-radius:8px;padding:1px 7px;cursor:pointer;white-space:nowrap}
.clink:hover{background:var(--blue);color:#fff}
.clink.zero{border-color:var(--line);background:#fff;color:var(--ink3);cursor:default}
.mxsub{font-size:11px;color:var(--ink3);margin:0 0 8px;line-height:1.6}
.mxsub b{color:var(--teal800);font-weight:600}
.fbwrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:#fff;margin-top:10px}
table.fb{border-collapse:collapse;font-size:12px;width:100%;min-width:940px}
table.fb th{background:#f3f6f9;text-align:left;padding:8px 10px;font-size:11.5px;font-weight:600;
color:var(--ink2);border-bottom:1px solid var(--line);white-space:nowrap}
table.fb th em{font-style:normal;font-weight:400;font-size:10.5px;color:var(--ink3);display:block}
table.fb td{padding:8px 10px;border-bottom:1px solid #eef1f4;vertical-align:top;line-height:1.6}
table.fb td.st{font-weight:600;color:var(--teal800);white-space:nowrap}
table.fb td.st i{display:inline-block;width:17px;height:17px;border-radius:50%;background:var(--teal);
color:#fff;font-style:normal;font-size:10.5px;text-align:center;line-height:17px;margin-right:5px}
table.fb td em{font-style:normal;color:var(--ink3);font-size:11px;display:block;margin-top:2px}
.mxsec{margin:16px 0 6px;font-size:13px;font-weight:600;color:var(--teal800);
border-bottom:1px solid var(--teal50);padding-bottom:4px}
.mxsec em{font-style:normal;font-weight:400;font-size:11.5px;color:var(--ink3);margin-left:6px}
table.pc{border-collapse:collapse;font-size:12px;width:100%}
table.pc th{background:#f3f6f9;text-align:left;padding:7px 10px;font-size:11.5px;font-weight:600;
color:var(--ink2);border-bottom:1px solid var(--line)}
table.pc th em{font-style:normal;font-weight:400;font-size:10.5px;color:var(--ink3);display:block}
table.pc td{padding:7px 10px;border-bottom:1px solid #eef1f4;vertical-align:top;line-height:1.6}
table.pc td.k{font-weight:600;color:var(--teal800);white-space:nowrap}
table.pc td.k em{display:block;font-style:normal;font-weight:400;font-size:10.5px;color:var(--ink3)}

/* ============ 编辑模式 ============ */
.bar button.edon{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:600}
.ebar{display:none;align-items:center;gap:9px;flex-wrap:wrap;margin-top:9px;padding:7px 11px;
background:var(--teal50);border:1px solid var(--teal);border-radius:9px;font-size:12px;color:var(--teal800)}
.ebar b{font-weight:600}
.ebar em{font-style:normal;font-size:11px;color:var(--teal800);opacity:.82}
.ebar button{padding:3px 10px;border:1px solid var(--teal);background:#fff;
border-radius:7px;font-size:11.5px;font-family:inherit;color:var(--teal800);cursor:pointer}
.ebar button:hover{background:var(--teal);color:#fff}
.ebar button:last-child{margin-left:auto}
.tg .x{display:inline-block;margin-left:4px;padding:0 3px;border-radius:5px;cursor:pointer;
font-weight:600;font-style:normal;opacity:.55;font-size:11.5px;line-height:1.35}
.tg .x:hover{background:var(--redline);color:#fff;opacity:1}
.tg.e{background:var(--blue50);border-color:var(--blue);color:var(--blue800)}
.tg.e .x:hover{background:var(--redline);color:#fff}
.tg.none{background:#fff;border-style:dashed;color:var(--ink3);font-style:normal}
.cc.ed{border-color:var(--teal);box-shadow:0 0 0 2px var(--teal50)}
.erow{display:flex;gap:6px;margin:7px 0 0;flex-wrap:wrap}
.ebtn{padding:3px 10px;border:1px dashed var(--teal);background:#fff;border-radius:7px;
font-size:11.5px;font-family:inherit;color:var(--teal800);cursor:pointer}
.ebtn:hover{background:var(--teal50)}
.ebtn em{font-style:normal;font-size:10.5px;opacity:.75;margin-left:3px}
.ebtn.done{margin-top:9px;border-style:solid;background:var(--teal);color:#fff;border-color:var(--teal)}
.ebtn.done:hover{background:var(--teal800)}
.pick{margin:8px 0 0;padding:9px 11px;background:#f8fcfb;border:1px solid #cdeadf;border-radius:9px}
.pkt{font-size:11.5px;font-weight:600;color:var(--teal800);margin-bottom:7px}
.pkt em{font-style:normal;font-weight:400;color:var(--ink3);font-size:11px;margin-left:5px}
.pkg{display:flex;flex-wrap:wrap;gap:5px}
.pkb{display:inline-block;padding:2px 9px;border:1px solid var(--teal);background:#fff;
border-radius:14px;font-size:11.5px;color:var(--teal800);cursor:pointer}
.pkb:hover{background:var(--teal);color:#fff}
.pkb.none{border-style:dashed;color:var(--ink3);border-color:var(--line);cursor:default}
.pkb.none:hover{background:#fff;color:var(--ink3)}
.pkb em{font-style:normal;font-size:10.5px;opacity:.7;margin-left:3px}

/* ---- 空间矩阵编辑态 ---- */

opacity:.82;margin-left:4px}

</style>

<script>
(function(){
  var D = window.SM_DATA3 || {stressors:[],envGroups:[],measureGroups:[],measures:[],cases:[]};
  var I = window.SM_I18N || {ui:{},pathEn:{},kindEn:{}};
  var U = I.ui||{}, LVE = I.lvEn||{};
  var KN = window.SM_KNOWLEDGE || {};
  var S=D.stressors, G=D.envGroups, MG=D.measureGroups, M=D.measures, C=D.cases;
  var MO=D.matrixObjects||[], PC=D.paramCats||[], FB=D.feedback||[];
  var MOIX={}; MO.forEach(function(x){MOIX[x.id]=x;});
  var CIX={},GIX={},MGIX={},MIX={};
  C.forEach(function(x){CIX[x.id]=x;}); G.forEach(function(x){GIX[x.id]=x;});
  MG.forEach(function(x){MGIX[x.id]=x;}); M.forEach(function(x){MIX[x.id]=x;});
  /* ---- 第 3 维「引导」的通道 × 场景（Q19-D 双维可筛）---- */
  var GCH=D.guideChannels||[], GSC=D.guideScenarios||[], GMAT=D.guideMatrix||{};
  var GCHIX={},GSCIX={};
  GCH.forEach(function(x){GCHIX[x.key]=x;}); GSC.forEach(function(x){GSCIX[x.key]=x;});
  function gchN(k){return GCHIX[k]?GCHIX[k].zh:k;}
  function gchEn(k){return GCHIX[k]?(GCHIX[k].en||''):'';}
  function gscN(k){return GSCIX[k]?GSCIX[k].zh:k;}
  function gscEn(k){return GSCIX[k]?(GSCIX[k].en||''):'';}
  function gOK(ch,sc){ var r=(GMAT[ch]||{})[sc]; return !r||r!=='no'; }  // ✗ 的格子不可选
  /* ---- 案例 → 涉及的空间对象（由「措施大类 → 空间对象」派生，与矩阵页签同一数据源）---- */
  var CASE_OBJ={};
  C.forEach(function(c){
    var seen={},out=[];
    (c.measureGroups||[]).forEach(function(gid){
      var g=MGIX[gid]; if(!g||!g.objects) return;
      g.objects.forEach(function(oid){ if(!seen[oid]){seen[oid]=1;out.push(oid);} });
    });
    CASE_OBJ[c.id]=out;
  });
  function coOf(c){ return CASE_OBJ[c.id]||[]; }
  /* ---- 附注区：path 为 N / D 的措施大类（不参与筛选）---- */
  var NOTE_MG = MG.filter(function(g){ return g.path==='N'||g.path==='D'; });
  var MAIN_MG = MG.filter(function(g){ return g.path!=='N'&&g.path!=='D'; });
  var sel={s:{},g:{},m:{},o:{}};
  var gsel={ch:{},sc:{}};   // 「引导」的二级筛选：感官通道 × 目标场景（组内 OR，跨组 AND）
  var gOpen=false;          // 「引导」二级面板是否展开
  var noteOpen=false;       // 附注区是否展开
  var qf={dim:{},book:{},region:{}};   // 案例查询：维度 / 来源 / 地区（组内 OR，组间 AND）
  var order=['s','g','m','o'];
  var tab='case';
  var fold={s:false,g:false,m:false,o:false};
  var foldFilters=false;   // 是否收起左侧筛选列（给案例 / 知识卡腾空间）
  var scrollMem={};        // 各列滚动位置的记忆：折叠、展开、重渲染都能保持
  var mxHL=null;           // 空间矩阵里要高亮的空间对象 id（从措施页 / 案例页跳过来时设置）
  var objLock=null;        // 从矩阵点「相关案例」跳过来时，锁定的那一批案例 id
  var mxObj=null;          // 该锁定对应的空间对象 id（用于面包屑提示）
  var lang='both';   // zh | en | both
  var dOpen=false, dView={mode:'list',key:null,gid:null,q:'',onlySense:false};

  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function md(t){return esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');}
  function nOn(o){return Object.keys(o).length;}
  function toast(t){
    var el=document.getElementById('toast'); if(!el) return;
    el.textContent=t; el.classList.add('on');
    clearTimeout(el._t); el._t=setTimeout(function(){ el.classList.remove('on'); },1900);
  }
  function idx(list,id,k){ for(var i=0;i<list.length;i++){ if(list[i].id===id) return list[i][k]; } return id; }
  // 名称显示：按 lang 组合主名 + 副名
  function dual(zh,en,cls){
    zh=zh||''; en=en||'';
    if(lang==='zh') return esc(zh||en);
    if(lang==='en') return esc(en||zh);
    if(!en||en===zh) return esc(zh);
    if(!zh) return esc(en);
    return esc(zh)+'<em>'+esc(en)+'</em>';
  }
  // 正文显示：中文 + 英文（英文以 .en 块附在下方）
  function kb(zh,en){
    var h='';
    if(lang!=='en' && zh) h+=md(zh);
    if(lang==='en'){ if(en) h+=md(en); return h; }
    if(lang==='both' && en) h+='<span class="en">'+md(en)+'</span>';
    return h;
  }
  function sn(sid){ return idx(S,sid,'name'); }
  function snEn(sid){ return idx(S,sid,'nameEn'); }
  function gn(gid){ return GIX[gid]?GIX[gid].zh:gid; }
  function gnEn(gid){ return GIX[gid]?(GIX[gid].en||''):''; }
  function mn(mid){ return MGIX[mid]?MGIX[mid].name:mid; }
  function mnEn(mid){ return MGIX[mid]?(MGIX[mid].nameEn||''):''; }
  function urls(t){return (t||'').match(/https?:\/\/[^\s｜]+/g)||[];}
  function hasAny(set,arr){ for(var k in set){ if(arr.indexOf(k)>=0) return true; } return false; }
  function mHasAny(ids,set){ for(var k in set){ if(ids.indexOf(k)>=0) return true; } return false; }
  // 知识卡名归一化（与后端 norm 一致）
  function knorm(s){ s=(s||'').replace(/^★/,'').trim(); var i=s.indexOf('（');
    return i>=0? s.slice(0,i).trim():s; }
  // 知识卡 → 所属大类
  var KN2G={}, KN_LIST=[];
  G.forEach(function(g){
    (g.itemsZh||[]).forEach(function(it){
      if(it.indexOf('—')===0) return;
      var k=knorm(it);
      if(!KN[k]) return;
      if(!KN2G[k]){ KN2G[k]=[]; KN_LIST.push({key:k,gid:g.id}); }
      KN2G[k].push(g);
    });
  });
  var KN_KEYS={}; KN_LIST.forEach(function(x){KN_KEYS[x.key]=1;});
  // 多感官相关大类（用于「只看多感官」筛选）
  var SENSE_G={'E2':1,'E4':1,'E5':1,'E12':1};

  // ---- 关联因子的人工筛查（编辑模式）----
  var EDIT_KEY='sm_case_links_v1';
  var editMode=false, addOpen=null;
  var ORIG={}, EDIT={};
  C.forEach(function(c){ ORIG[c.id]={s:(c.stressors||[]).slice(), g:(c.envGroups||[]).slice()}; });
  try{ EDIT=JSON.parse(localStorage.getItem(EDIT_KEY)||'{}')||{}; }catch(e){ EDIT={}; }

  // ---- 空间矩阵的人工筛查（编辑模式，第二份可编辑数据）----
  // 与案例关联分开存 key：矩阵改的是「参数可调性 / 措施↔对象映射 / 参数增删」，数据结构完全不同
  var MX_KEY='sm_matrix_edit_v1';
  var MX={};      // { params:{objId:{rt:[],dz:[],add:[],del:[]}}, objMeas:{objId:[mid]}, measSw:{mid:{add:[],del:[]}} }
  var MXC={};     // 与 MX 同结构、未改动字段留空 —— 渲染时 applyMatrixEdit 直接读 MX
  var mxOpen=null;   // 当前展开的候选面板：{oid, kind}
  // 内置快照（供「还原矩阵」用）：每个对象的参数集合、可调集合、措施集合
  var MX_SNAP={};
  function snapMatrix(){
    MX_SNAP={};
    MO.forEach(function(o){
      MX_SNAP[o.id]={
        params:o.params.slice(),
        rt:(o.runtime||[]).slice(),
        dz:(o.design||[]).slice(),
        meas:(o.measures||[]).slice()
      };
    });
  }
  snapMatrix();
  try{ MX=JSON.parse(localStorage.getItem(MX_KEY)||'{}')||{}; }catch(e){ MX={}; }
  // 归一化结构：从 localStorage 读回来的可能是残缺对象，必须补齐键，否则 MX.params[x]=… 会抛错
  function normMX(){
    if(!MX || typeof MX!=='object') MX={};
    if(!MX.params || typeof MX.params!=='object') MX.params={};
    if(!MX.measSw || typeof MX.measSw!=='object') MX.measSw={};
    if(!MX.objMeas || typeof MX.objMeas!=='object') MX.objMeas={};
    return MX;
  }
  normMX();
  function mxTouched(){
    return Object.keys(MX.params||{}).length + Object.keys(MX.objMeas||{}).length +
           Object.keys(MX.measSw||{}).length;
  }
  function saveMatrixEdit(){
    try{ localStorage.setItem(MX_KEY, JSON.stringify(MX)); }
    catch(e){ toast(lang==='en'?'Cannot save in this browser':'本机浏览器无法保存'); }
  }
  function applyEdit(){
    C.forEach(function(c){
      var e=EDIT[c.id]; if(!e) return;
      if(e.s) c.stressors=e.s.slice();
      if(e.g) c.envGroups=e.g.slice();
    });
  }
  function saveEdit(){
    try{ localStorage.setItem(EDIT_KEY, JSON.stringify(EDIT)); }
    catch(e){ toast(lang==='en'?'Cannot save in this browser':'本机浏览器无法保存'); }
  }
  function touch(cid){
    var c=CIX[cid]; if(!c) return;
    EDIT[cid]={s:(c.stressors||[]).slice(), g:(c.envGroups||[]).slice()};
    saveEdit();
  }

  // ---- 案例全文索引：名称 / 地区 / 负责人 / 中英概括 / 关键数据 / 各类标签 ----
  var CASE_HAY={};
  function buildHay(){
    CASE_HAY={};
    C.forEach(function(c){
      var p=[c.name,c.nameEn,c.region,c.year,c.owner,c.dim,c.book,c.summary,c.summaryEn,c.srclink];
      (c.kv||[]).forEach(function(r){ p.push((r||[]).join(' ')); });
      (c.stressors||[]).forEach(function(x){ p.push(sn(x),snEn(x)); });
      (c.measureGroups||[]).forEach(function(x){
        var g=MGIX[x]; if(g) p.push(g.name,g.nameEn,g.desc,g.descEn);
      });
      (c.envGroups||[]).forEach(function(x){
        var g=GIX[x]; if(g) p.push(g.zh,g.en);
      });
      (c.measures||[]).forEach(function(x){
        var m=MIX[x]; if(m) p.push(m.name,m.nameEn);
      });
      // 「引导」的通道 / 场景 + 涉及的空间对象（第 4 维）也纳入全文搜索
      (c.guideCh||[]).forEach(function(x){ p.push(gchN(x),gchEn(x),'引导','Guidance'); });
      (c.guideSc||[]).forEach(function(x){ p.push(gscN(x),gscEn(x)); });
      (coOf(c)||[]).forEach(function(x){ var o=MOIX[x]; if(o) p.push(o.name,o.nameEn); });
      CASE_HAY[c.id]=p.filter(Boolean).join(' ').toLowerCase();
    });
  }
  // 改动关联后：重建搜索索引 + 重算「环境因子 → 关联胁迫因子」（供反查过滤）
  function rebuildAfterEdit(){
    buildHay();
    G.forEach(function(g){
      var ids={};
      C.forEach(function(c){
        if((c.envGroups||[]).indexOf(g.id)<0) return;
        (c.stressors||[]).forEach(function(s){ ids[s]=1; });
      });
      g.stressors=Object.keys(ids);
    });
  }

  /* ---- 空间矩阵编辑：把本机改动落到 MO 上，并重算全部派生量 ---- */
  // 派生链：措施↔对象（可改）→ 对象的措施集 → 对象的案例集（由措施的案例并集）→ 可调性
  // 两种改法并存：objMeas[oid] = 整体覆盖该对象的措施列表（权威）；measSw[mid] = 逐个增删（叠加）
  function measuresOfObj(oid){
    var sw=MX.measSw||{};
    // 先取基线：有整体覆盖用覆盖，否则用内置
    var cur = (MX.objMeas && MX.objMeas[oid])
      ? MX.objMeas[oid].slice()
      : (MOIX[oid]._baseMeas||[]).slice();
    // 再叠加逐条开关
    MG.forEach(function(g){
      var s=sw[g.id]; if(!s) return;
      var i=cur.indexOf(g.id);
      if(s.del && s.del.indexOf(oid)>=0 && i>=0) cur.splice(i,1);
      if(s.add && s.add.indexOf(oid)>=0 && cur.indexOf(g.id)<0) cur.push(g.id);
    });
    return cur;
  }
  // 记录内置基线（措施列表、参数列表），供编辑后回溯
  function ensureMatrixBaseline(){
    MO.forEach(function(o){
      if(!o._baseMeas) o._baseMeas=(o.measures||[]).slice();
      if(!o._baseParams) o._baseParams=(o.params||[]).slice();
    });
  }
  function applyMatrixEdit(){
    ensureMatrixBaseline();
    MO.forEach(function(o){
      // ---- 参数：删 / 加 + 可调性 ----
      var pe=(MX.params||{})[o.id];
      var params = o._baseParams.slice();
      var rt = (MX_SNAP[o.id].rt||[]).slice();
      var dz = (MX_SNAP[o.id].dz||[]).slice();
      if(pe){
        (pe.del||[]).forEach(function(p){ var i=params.indexOf(p); if(i>=0) params.splice(i,1); });
        (pe.add||[]).forEach(function(p){ if(params.indexOf(p)<0) params.push(p); });
        // rt / dz 是「该对象当前的完整可调性指派」；未指派的按内置回退
        if(pe.rt || pe.dz){
          var nrt=[], ndz=[];
          params.forEach(function(p){
            if((pe.rt||[]).indexOf(p)>=0) nrt.push(p);
            else if((pe.dz||[]).indexOf(p)>=0) ndz.push(p);
            else if(RT_SET0[p]) nrt.push(p);
            else ndz.push(p);
          });
          rt=nrt; dz=ndz;
        } else {
          rt = params.filter(function(p){ return RT_SET0[p]; });
          dz = params.filter(function(p){ return !RT_SET0[p]; });
        }
      } else {
        rt = params.filter(function(p){ return RT_SET0[p]; });
        dz = params.filter(function(p){ return !RT_SET0[p]; });
      }
      o.params = params;
      o.paramsEn = params.map(function(p){ return PARAM_EN_ALL[p]||p; });
      o.runtime = params.filter(function(p){ return rt.indexOf(p)>=0; });
      o.design  = params.filter(function(p){ return dz.indexOf(p)>=0; });
      o.n_param = params.length;
      o.n_runtime = o.runtime.length;
      o.n_design = o.design.length;
      // ---- 措施与案例（案例由「措施 → 案例」并集派生，与内置口径一致）----
      o.measures = measuresOfObj(o.id);
      o.n_measure = o.measures.length;
      var cids=[];
      o.measures.forEach(function(mid){
        var g=MGIX[mid]; if(!g) return;
        (g.cases||[]).forEach(function(cid){ if(cids.indexOf(cid)<0) cids.push(cid); });
      });
      o.cases=cids; o.n_case=cids.length;
      var f={};
      cids.forEach(function(cid){ var c=CIX[cid]; if(!c) return;
        (c.stressors||[]).forEach(function(s){ f[s]=(f[s]||0)+1; }); });
      o.stressors=Object.keys(f).map(function(k){ return [k,f[k]]; })
        .sort(function(a,b){ return b[1]-a[1]; });
    });
  }
  // 重建 RT_SET / DZ_SET（pchip 上色与概览数字都依赖它）
  function rebuildParamSets(){
    RT_SET={}; DZ_SET={};
    MO.forEach(function(o){
      (o.runtime||[]).forEach(function(p){RT_SET[p]=1;});
      (o.design||[]).forEach(function(p){DZ_SET[p]=1;});
    });
  }
  // 矩阵编辑的总入口：落改动 → 重算可调性表 → 重建搜索索引 → 重渲染
  function applyMatrixAndRender(){
    applyMatrixEdit();
    rebuildParamSets();
    rebuildAfterEdit();
    render();
  }
  // 给某个对象加一个参数（新词自动按「设计期定死」起步，可在页面上切）
  function addMatrixParam(oid, p){
    var o=MOIX[oid]; if(!o) return;
    p=String(p||'').trim(); if(!p) return;
    if(!MX.params[oid]){
      MX.params[oid]={rt:(o.runtime||[]).slice(), dz:(o.design||[]).slice(), add:[], del:[]};
    }
    var ep=MX.params[oid];
    ep.rt=ep.rt||[]; ep.dz=ep.dz||[]; ep.add=ep.add||[]; ep.del=ep.del||[];
    var di=ep.del.indexOf(p);
    if(di>=0){ ep.del.splice(di,1); }              // 之前在删除表里 → 撤销删除
    else if(o.params.indexOf(p)<0){
      if(ep.add.indexOf(p)<0) ep.add.push(p);
      if(ep.dz.indexOf(p)<0) ep.dz.push(p);        // 新参数默认设计期定死
    }
    saveMatrixEdit(); applyMatrixAndRender();
  }
  applyEdit();
  buildHay();
  // 搜索词：空格分隔 = 多词 AND
  function qRaw(){ var el=document.getElementById('q'); return el?el.value.trim():''; }
  function qMatch(hay){
    var q=qRaw().toLowerCase();
    if(!q) return true;
    var ws=q.split(/\s+/);
    for(var i=0;i<ws.length;i++){ if((hay||'').toLowerCase().indexOf(ws[i])<0) return false; }
    return true;
  }
  function caseHayPass(c){ return qMatch(CASE_HAY[c.id]||''); }

  function quickPass(c){
    if(nOn(qf.dim)&&!qf.dim[c.dim]) return false;
    if(nOn(qf.book)&&!qf.book[c.book]) return false;
    if(nOn(qf.region)){
      var r=c.region||'', ok=false;
      if(qf.region['中国']&&r.indexOf('中国')>=0) ok=true;
      if(qf.region['上海']&&r.indexOf('上海')>=0) ok=true;
      if(qf.region['海外']&&r.indexOf('中国')<0) ok=true;
      if(!ok) return false;
    }
    return true;
  }
  function casePass(c){
    if(!quickPass(c)) return false;
    if(!caseHayPass(c)) return false;
    if(objLock && objLock.indexOf(c.id)<0) return false;
    if(nOn(sel.s)&&!hasAny(sel.s,c.stressors)) return false;
    if(nOn(sel.g)&&!hasAny(sel.g,c.envGroups)) return false;
    if(nOn(sel.m)&&!hasAny(sel.m,c.measureGroups)) return false;
    if(nOn(sel.o)&&!hasAny(sel.o,coOf(c))) return false;
    // 「引导」二级：通道组内 OR、场景组内 OR、两组之间 AND
    if(nOn(gsel.ch)&&!hasAny(gsel.ch,c.guideCh||[])) return false;
    if(nOn(gsel.sc)&&!hasAny(gsel.sc,c.guideSc||[])) return false;
    return true;
  }
  // 第 4 维是否还有效：若所选对象在当前其它条件下已无案例，计数为 0（仍显示但标零）
  function countForObj(oid){
    var n=0;
    C.forEach(function(c){
      if(coOf(c).indexOf(oid)<0) return;
      if(!quickPass(c)||!caseHayPass(c)) return;
      if(objLock && objLock.indexOf(c.id)<0) return;
      if(nOn(sel.s)&&!hasAny(sel.s,c.stressors)) return;
      if(nOn(sel.g)&&!hasAny(sel.g,c.envGroups)) return;
      if(nOn(sel.m)&&!hasAny(sel.m,c.measureGroups)) return;
      if(nOn(sel.o)&&!sel.o[oid]) return;
      if(nOn(gsel.ch)&&!hasAny(gsel.ch,c.guideCh||[])) return;
      if(nOn(gsel.sc)&&!hasAny(gsel.sc,c.guideSc||[])) return;
      n++;
    });
    return n;
  }
  // 「引导」二级的计数（通道 / 场景各一个）
  function countForGuide(kind,key){
    var n=0;
    C.forEach(function(c){
      var arr = kind==='ch' ? (c.guideCh||[]) : (c.guideSc||[]);
      if(arr.indexOf(key)<0) return;
      if(!quickPass(c)||!caseHayPass(c)) return;
      if(objLock && objLock.indexOf(c.id)<0) return;
      if(nOn(sel.s)&&!hasAny(sel.s,c.stressors)) return;
      if(nOn(sel.g)&&!hasAny(sel.g,c.envGroups)) return;
      if(nOn(sel.m)&&!hasAny(sel.m,c.measureGroups)) return;
      if(nOn(sel.o)&&!hasAny(sel.o,coOf(c))) return;
      var other = kind==='ch' ? gsel.sc : gsel.ch;
      var oArr  = kind==='ch' ? (c.guideSc||[]) : (c.guideCh||[]);
      if(nOn(other)&&!hasAny(other,oArr)) return;
      n++;
    });
    return n;
  }
  // 从空间矩阵点「相关案例」跳过来：清掉既有条件，只锁这一批案例
  function setObjCases(oid){
    var o=MOIX[oid]; if(!o) return;
    sel={s:{},g:{},m:{},o:{}}; gsel={ch:{},sc:{}}; qf={dim:{},book:{},region:{}};
    var qi=document.getElementById('q'); if(qi) qi.value='';
    objLock=o.cases.slice();
    mxHL=null; mxObj=oid;
    render();
    toast(lang==='en'
      ? 'Locked to the '+o.cases.length+' cases of '+o.name
      : '已锁定「'+o.name+'」的 '+o.cases.length+' 个案例');
  }
  function mGPass(g){
    if(nOn(sel.m)&&!sel.m[g.id]) return false;
    if(nOn(sel.g)&&!hasAny(sel.g,g.envGroups)) return false;
    if(nOn(sel.s)){
      var ok=false;
      for(var i=0;i<g.cases.length;i++){ var c=CIX[g.cases[i]];
        if(c&&hasAny(sel.s,c.stressors)){ok=true;break;} }
      if(!ok) return false;
    }
    return true;
  }
  function envPass(g){
    if(nOn(sel.g)&&!sel.g[g.id]) return false;
    if(nOn(sel.s)&&!hasAny(sel.s,g.stressors)) return false;
    if(nOn(sel.m)&&!mHasAny(g.measures,sel.m)) return false;
    return true;
  }
  function matchCases(){ return C.filter(casePass); }

  // 除指定维度外，其余条件是否全部通过 —— 用于各维「当前条件下的案例数」
  // skip 取值：'s' 胁迫因子 / 'g' 环境因子 / 'm' 措施 / 'o' 空间对象 / 'gc' 引导通道 / 'gs' 引导场景
  function passExcept(c,skip){
    if(!quickPass(c)||!caseHayPass(c)) return false;
    if(objLock && objLock.indexOf(c.id)<0) return false;
    if(skip!=='s' && nOn(sel.s) && !hasAny(sel.s,c.stressors)) return false;
    if(skip!=='g' && nOn(sel.g) && !hasAny(sel.g,c.envGroups)) return false;
    if(skip!=='m' && nOn(sel.m) && !hasAny(sel.m,c.measureGroups)) return false;
    if(skip!=='o' && nOn(sel.o) && !hasAny(sel.o,coOf(c))) return false;
    if(skip!=='gc' && nOn(gsel.ch) && !hasAny(gsel.ch,c.guideCh||[])) return false;
    if(skip!=='gs' && nOn(gsel.sc) && !hasAny(gsel.sc,c.guideSc||[])) return false;
    return true;
  }
  function countForStressor(sid){
    var n=0; C.forEach(function(c){
      if(!c.stressors||c.stressors.indexOf(sid)<0) return;
      if(passExcept(c,'s')) n++; });
    return n;
  }
  function countForEnv(gid){
    var n=0; C.forEach(function(c){
      if(c.envGroups.indexOf(gid)<0) return;
      if(passExcept(c,'g')) n++; });
    return n;
  }
  function countForMG(gid){
    var n=0; C.forEach(function(c){
      if((c.measureGroups||[]).indexOf(gid)<0) return;
      if(passExcept(c,'m')) n++; });
    return n;
  }
  function relevantEnv(){
    var set={};
    for(var k in sel.s){ var s=null;
      for(var i=0;i<S.length;i++){if(S[i].id===k)s=S[i];}
      if(s) s.envGroups.forEach(function(x){set[x]=1;});
    }
    return set;
  }

  function optRow(dim,id,zh,en,n,extra){
    var on = sel[dim][id];
    var kico = (extra&&extra.kn)
      ? '<span class="knb-ico" data-kn="'+esc(id)+'" title="'+
        (lang==='en'?'View knowledge notes':'查看知识卡')+'">'+extra.kn+'</span>' : '';
    return '<div class="opt'+(on?' on':'')+(n===0?' zero':'')+
      '" data-d="'+dim+'" data-id="'+esc(id)+'"><span class="bx"></span>'+
      '<span class="lb">'+dual(zh,en)+'</span>'+
      (extra&&extra.kind?'<span class="kind">'+
        esc(lang==='en'?((I.kindEn||{})[extra.kind]||extra.kind):extra.kind)+'</span>':'')+
      (extra&&extra.meta?extra.meta:'')+
      kico+
      '<span class="c">'+n+'</span></div>';
  }

  // ① 气候胁迫因子 —— 严格 6 类，不再分「命题 / 补充」，不再显示来源标记
  function renderColStress(){
    var h='<div class="ch" data-f="s"><span class="tri">▼</span>'+
      dual('① 气候胁迫因子','① Climate Stressor')+'<span class="n">'+nOn(sel.s)+' / '+S.length+
      '</span></div><div class="cbody">';
    var shown=S.filter(function(s){ return qMatch(s.name+' '+(s.nameEn||'')); });
    if(!shown.length) return h+'<div class="empty">'+dual('无匹配项','No match')+'</div></div>';
    h+='<div class="grp">'+dual('六类气候胁迫因子','Six climate stressors')+'</div>';
    shown.forEach(function(s){ h+=optRow('s',s.id,s.name,s.nameEn,countForStressor(s.id),{}); });
    return h+'</div>';
  }

  function renderColEnv(){
    var rel=relevantEnv(), onlyRel=document.getElementById('rel').checked && nOn(sel.s);
    var showSub=document.getElementById('knsub').checked;
    var h='<div class="ch" data-f="g"><span class="tri">▼</span>'+
      dual('② 基础环境因子（大类）','② Environmental Factor (group)')+
      '<span class="n">'+nOn(sel.g)+'</span></div><div class="cbody">';
    var layers=[['physical',lang==='en'?'Physical layer':'物理层面'],
                ['experiential',lang==='en'?'Experiential layer':'体验层面']];
    layers.forEach(function(L){
      var lst=G.filter(function(g){ return g.layer===L[0]; });
      var o='<div class="grp">'+L[1]+'</div>', any=false;
      lst.forEach(function(g){
        if(!qMatch(g.zh+' '+(g.en||''))) return;
        var isRel = rel[g.id];
        if(onlyRel && !isRel) return;
        any=true;
        o+=optRow('g',g.id,g.zh,g.en,countForEnv(g.id),
                  g.n_kn?{kn:g.n_kn}:{});
        if(showSub && g.itemsZh){
          var ien=g.itemsEn||[];
          g.itemsZh.forEach(function(it,i){
            var en=ien[i]||'';
            if(it.indexOf('—')===0){
              o+='<div class="ksep">'+dual(it.replace(/—/g,'').trim(), en.replace(/—/g,'').trim())+'</div>';
              return;
            }
            var k=knorm(it), has=!!KN[k];
            o+='<div class="kni'+(has?' has':'')+'"'+(has?' data-knkey="'+esc(k)+'"':'')+'>'+
               '<span class="dot"></span>'+
               '<span class="klb">'+dual(it.replace(/^★/,''), en.replace(/^★/,''))+'</span>'+
               (/^★/.test(it)?'<span class="star">★</span>':'')+'</div>';
          });
        }
      });
      if(any) h+=o;
    });
    if(onlyRel) h+='<div class="grp">'+(lang==='en'
      ? 'Filtered by selected stressors ('+Object.keys(rel).length+' related)'
      : '已按所选胁迫因子过滤显示（'+Object.keys(rel).length+' 类相关）')+'</div>';
    return h+'</div>';
  }

  /* ---- 「引导」二级面板：感官通道 × 目标场景（Q19-D）---- */
  function guidePanel(){
    var h='<div class="gpanel">';
    h+='<span class="gl">'+dual('感官通道（组内 OR）','Sensory channel (OR within)')+'</span>';
    GCH.forEach(function(x){
      var on=gsel.ch[x.key], n=countForGuide('ch',x.key);
      h+='<span class="gc'+(on?' on':'')+'" data-gc="ch" data-gk="'+esc(x.key)+'" title="'+
         esc(lang==='en'?'cases under current filter':'当前条件下的案例数')+'">'+
         dual(x.zh,x.en)+'<i>'+n+'</i></span>';
    });
    h+='<span class="gl" style="margin-top:5px">'+dual('目标场景（组内 OR）','Target scenario (OR within)')+'</span>';
    var chs=Object.keys(gsel.ch);
    GSC.forEach(function(x){
      var on=gsel.sc[x.key], n=countForGuide('sc',x.key);
      // 已选通道对该场景「全部无据」→ 置灰不可选（这就是 5×6 矩阵里的 ✗ 格）
      var blocked=false;
      if(chs.length){ blocked=true; chs.forEach(function(ck){ if(gOK(ck,x.key)) blocked=false; }); }
      h+='<span class="gc'+(on?' on':'')+(blocked?' off':'')+'"'+
         (blocked?'':' data-gc="sc" data-gk="'+esc(x.key)+'"')+
         ' title="'+esc(blocked
            ? (lang==='en'?'No evidence for the selected channel(s) on this scenario':'所选通道对该场景无实证，已置灰')
            : (lang==='en'?'cases under current filter':'当前条件下的案例数'))+'">'+
         dual(x.zh,x.en)+'<i>'+n+'</i></span>';
    });
    h+='<div style="font-size:10.5px;color:var(--purple800);margin-top:2px;line-height:1.5">'+dual(
      '实证缺口：雨水会冲刷气味、强风会稀释气味、避雨与避风场景无温差可用、触觉难以表达干湿 —— 这几格不成立，故置灰。',
      'Evidence gaps: rain washes scent away, strong wind dilutes it, no temperature difference exists in rain or wind shelter, and touch cannot convey dryness — those cells are greyed out.')+
      '</div>';
    h+='<div style="margin-top:4px"><span class="gc" data-gclr="1">'+dual('清空引导筛选','Clear guidance filter')+'</span></div>';
    return h+'</div>';
  }

  /* ---- 附注区：技术支撑 / 运营治理（不参与筛选，Q3-A + Q13-A 默认收起）---- */

  function qfN(kind,v){
    var n=0;
    C.forEach(function(c){
      var r=c.region||'';
      if(kind==='dim'&&c.dim===v) n++;
      else if(kind==='book'&&c.book===v) n++;
      else if(kind==='region'){
        if(v==='中国'&&r.indexOf('中国')>=0) n++;
        else if(v==='上海'&&r.indexOf('上海')>=0) n++;
        else if(v==='海外'&&r.indexOf('中国')<0) n++;
      }
    });
    return n;
  }

         dual(it[1],it[2])+'<span class="n">'+qfN(kind,it[0])+'</span></span>';

  /* ==================== 空间矩阵（机制轴） ==================== */
  // 参数 → 可调性查询表（构建一次；RT_SET/DZ_SET 是模块级，pchip 靠它上色）
  var RT_SET={}, DZ_SET={};
  // 内置基线（编辑后回溯用；RT_SET0/DZ_SET0 永不被编辑覆盖）
  var RT_SET0={}, DZ_SET0={}, PARAM_EN_ALL={};
  MO.forEach(function(o){
    (o.runtime||[]).forEach(function(p){RT_SET[p]=1; RT_SET0[p]=1;});
    (o.design||[]).forEach(function(p){DZ_SET[p]=1; DZ_SET0[p]=1;});
    o.params.forEach(function(p,i){ if(!PARAM_EN_ALL[p]) PARAM_EN_ALL[p]=o.paramsEn[i]; });
  });
  PC.forEach(function(c){
    c.vars.forEach(function(v,i){ if(!PARAM_EN_ALL[v]) PARAM_EN_ALL[v]=c.varsEn[i]; });
  });
  // 加载时落地本机的矩阵改动（必须在 RT_SET0 / PARAM_EN_ALL 建好之后，
  // 否则 applyMatrixEdit 里读 PARAM_EN_ALL / RT_SET0 会拿到 undefined）
  applyMatrixEdit();
  rebuildParamSets();
  function pchip(p, en){
    return '<span class="pchip '+(RT_SET[p]?'rt':'dz')+'">'+esc(p)+
      (en&&en!==p?'<em>'+esc(en)+'</em>':'')+'</span>';
  }

  function matrixRows(){
    var op = qRaw();
    return MO.filter(function(o){
      if(!op) return true;
      var hay=[o.name,o.nameEn,o.desc,o.descEn].concat(o.params,o.paramsEn).join(' ').toLowerCase();
      var ws=op.toLowerCase().split(/\s+/);
      for(var i=0;i<ws.length;i++){ if(hay.indexOf(ws[i])<0) return false; }
      return true;
    });
  }

  /* ---- 矩阵编辑用的小组件 ---- */
  // 参数芯片（编辑态）：带 × 删除、带「调/固」切换可调性
  function pchipEd(o,p,en){
    var isRt = o.runtime.indexOf(p)>=0;
    var tDel = lang==='en'?'Remove this parameter':'删除这个参数';
    var tTog = lang==='en'
      ? (isRt?'Currently adjustable at runtime — click to mark as design-stage fixed'
             :'Currently fixed at design stage — click to mark as adjustable at runtime')
      : (isRt?'当前为「运行中可调」—— 点一下改为「设计期定死」'
             :'当前为「设计期定死」—— 点一下改为「运行中可调」');
    return '<span class="pchip '+(isRt?'rt':'dz')+' ed" data-mxp="'+esc(p)+'" data-oid="'+o.id+'" title="'+
      esc(tTog)+'">'+esc(p)+
      (en&&en!==p?'<em>'+esc(en)+'</em>':'')+
      '<b class="rtg" data-mxtog="'+esc(p)+'" data-oid="'+o.id+'">'+(isRt?dual('调','RT'):dual('固','FIX'))+'</b>'+
      '<b class="px" data-mxdelp="'+esc(p)+'" data-oid="'+o.id+'" title="'+esc(tDel)+'">×</b></span>';
  }
  // 措施标签（编辑态）：带 × 删除
  function mlinkEd(oid,mid){
    var g=MGIX[mid]; if(!g) return '';
    var t=lang==='en'?'Unmap this measure group from the object':'解除这个措施大类与该对象的映射';
    return '<span class="mlink ed" data-mxdelm="'+esc(mid)+'" data-oid="'+oid+'" title="'+esc(t)+'">'+
      dual(g.name,g.nameEn)+' <b class="px" style="margin-left:2px">×</b></span>';
  }
  // 候选面板：给某个对象补参数 / 补措施
  function mxPickPanel(o,kind){
    var h='<div class="mxpick"><div class="pkt">'+
      (kind==='p'?dual('可添加的参数变量','Parameters to add')
                 :dual('可添加的措施大类','Measure groups to add'))+
      '<em>'+(lang==='en'?'click to add':'点一下即添加')+'</em></div><div class="pkg">';
    var n=0;
    if(kind==='p'){
      // 候选 = 全库参数词（矩阵 + 参数库）里该对象还没有的
      var seen={};
      var pool=[];
      MO.forEach(function(x){ x._baseParams.forEach(function(p){ if(!seen[p]){seen[p]=1;pool.push(p);} }); });
      PC.forEach(function(c){ c.vars.forEach(function(v){ if(!seen[v]){seen[v]=1;pool.push(v);} }); });
      pool.sort();
      pool.forEach(function(p){
        if(o.params.indexOf(p)>=0) return;
        n++;
        h+='<span class="pkb" data-mxaddp="'+esc(p)+'" data-oid="'+o.id+'">'+
           esc(p)+(PARAM_EN_ALL[p]&&PARAM_EN_ALL[p]!==p?'<em>'+esc(PARAM_EN_ALL[p])+'</em>':'')+'</span>';
      });
    } else {
      MG.forEach(function(g){
        if(o.measures.indexOf(g.id)>=0) return;
        n++;
        h+='<span class="pkb" data-mxaddm="'+esc(g.id)+'" data-oid="'+o.id+'">'+
           dual(g.name,g.nameEn)+'<em>'+(lang==='en'?g.n_case+' cases':g.n_case+' 例')+'</em></span>';
      });
    }
    if(!n) h+='<span class="pkb none">'+(lang==='en'?'nothing left to add':'已全部加入')+'</span>';
    h+='</div>';
    if(kind==='p'){
      h+='<div class="mximput"><input type="text" id="mxnew" data-oid="'+o.id+
         '" placeholder="'+(lang==='en'?'or type a new parameter…':'或直接输入新参数…')+
         '"><button data-mxnewp="1" data-oid="'+o.id+'">'+dual('加入','Add')+'</button></div>';
    }
    h+='<button class="ebtn done" data-mxopen="close">'+dual('完成','Done')+'</button></div>';
    return h;
  }

      h+='</div>';

    if(u.length) h+='<div class="kv">'+u.slice(0,3).map(function(x,i){
      return '<a href="'+esc(x)+'" target="_blank" rel="noopener">'+
        (lang==='en'?'Source ':'来源 ')+(i+1)+'</a>';}).join(' ｜ ')+'</div>';
    // 反查：这个案例的措施作用在哪些空间对象上 → 跳到空间矩阵
    var objs=[];
    (c.measureGroups||[]).forEach(function(mid){
      var g=MGIX[mid]; if(!g||!g.objects) return;
      g.objects.forEach(function(oid){ if(objs.indexOf(oid)<0) objs.push(oid); });
    });
    if(objs.length){
      h+='<div class="mxsub" style="margin-top:5px">'+

      });
      if(objs.length>8) h+='<span class="mxsub">…</span>';
      h+='</div>';
    }
    return h+'</div>';
  }

  function rememberScroll(){
    Array.prototype.forEach.call(document.querySelectorAll('.col'),function(el){
      scrollMem[el.getAttribute('data-col')||'res']=el.scrollTop;
    });
  }
  function restoreScroll(){
    Array.prototype.forEach.call(document.querySelectorAll('.col'),function(el){
      var k=el.getAttribute('data-col')||'res';
      if(scrollMem[k]!=null) el.scrollTop=scrollMem[k];
    });
  }

      return '<div class="'+cls[k]+(fold[k]?' fold':'')+'" data-col="'+k+'">'+cols[k]+'</div>';

    restoreScroll();

    // 折叠 / 展开时列宽变化很大，首次赋值仍可能被 clamp —— 等布局稳定后再校正一次

    for(var d in sel.m){ cr+='<span class="chip m" data-cd="m" data-cid="'+esc(d)+'">'+dual(mn(d),mnEn(d))+' ×</span>'; any=true; }

  function lvName(v){
    if(lang==='en') return LVE[v]||v;
    return v==='ok'?'舒适 / 可用':v==='warn'?'需注意':v==='bad'?'有害 / 禁用':'说明';
  }
  function knGroupOf(key){
    var gs=KN2G[key]; if(!gs||!gs.length) return null;
    return dView.gid ? (gs.filter(function(g){return g.id===dView.gid;})[0]||gs[0]) : gs[0];
  }

  function knCardHtml(key){
    var c=KN[key]; if(!c) return '';
    var g=knGroupOf(key);
    var h='<div class="kh"><h2>'+dual(key,c.titleEn||'')+'</h2>'+
      (c.unit?'<span class="unit">'+esc(lang==='en'?(c.unitEn||c.unit):c.unit)+'</span>':'')+
      (g?'<span class="khg">'+dual(g.zh,g.en)+'</span>':'')+'</div>';
    if(c.desc) h+='<div class="kbox">'+kb(c.desc,c.descEn)+'</div>';

    if(c.ranges&&c.ranges.length){
      h+='<div class="kh3">'+dual('适宜区间与阈值','Values and thresholds')+'</div>'+
         '<table><thead><tr><th style="width:150px">'+dual('数值','Value')+'</th>'+
         '<th>'+dual('含义','Meaning')+'</th><th style="width:96px">'+dual('判读','Reading')+'</th>'+
         '</tr></thead><tbody>';
      c.ranges.forEach(function(r,i){
        var en=(c.rangesEn||[])[i]||'';
        h+='<tr class="lv-'+esc(r[2]||'info')+'"><td class="v">'+esc(r[0])+'</td><td>'+
           (lang==='en'? esc(en) : esc(r[1])+(lang==='both'&&en?'<span class="en">'+esc(en)+'</span>':''))+
           '</td><td><span class="tag">'+esc(lvName(r[2]||'info'))+'</span></td></tr>';
      });
      h+='</tbody></table>';
    }

    if(c.targets&&c.targets.length){
      h+='<div class="kh3">'+dual('设计目标','Design targets')+'</div><table><tbody>';
      c.targets.forEach(function(t,i){
        var en=(c.targetsEn||[])[i]||['',''];
        var a = lang==='en'? (en[0]||t[0]) : t[0];
        var b = lang==='en'? (en[1]||t[1]) : t[1];
        h+='<tr><td style="width:180px;color:#5b6470">'+esc(a)+
           (lang==='both'&&en[0]?'<span class="en">'+esc(en[0])+'</span>':'')+'</td><td><b>'+esc(b)+'</b>'+
           (lang==='both'&&en[1]?'<span class="en">'+esc(en[1])+'</span>':'')+'</td></tr>';
      });
      h+='</tbody></table>';
    }

    if(c.why||c.whyEn) h+='<div class="kh3">'+dual('为什么重要','Why it matters')+'</div>'+
      '<div class="kbox hl">'+kb(c.why,c.whyEn)+'</div>';
    if(c.how||c.howEn) h+='<div class="kh3">'+dual('怎么用','How to use it')+'</div>'+
      '<div class="kbox">'+kb(c.how,c.howEn)+'</div>';
    if(c.watch||c.watchEn) h+='<div class="kbox warn"><b>'+dual('注意　','Caution　')+'</b>'+
      kb(c.watch,c.watchEn)+'</div>';

    if(c.cases&&c.cases.length){
      h+='<div class="kh3">'+dual('相关案例','Related cases')+'</div>';
      c.cases.forEach(function(x,i){
        var en=(c.casesEn||[])[i]||x;
        h+='<span class="pill">'+dual(x,en)+'</span>';
      });
    }
    if(c.srcs&&c.srcs.length){
      h+='<div class="kh3">'+dual('来源','Sources')+'</div><ul style="margin:0;padding-left:18px;font-size:12px">';
      c.srcs.forEach(function(s,i){
        var en=(c.srcsEn||[])[i]||'';
        var nm = lang==='en'? (en||s[0]) : s[0];
        h+='<li>'+(s[1]? '<a href="'+esc(s[1])+'" target="_blank" rel="noopener">'+esc(nm)+'</a>' : esc(nm));
        if(lang==='both'&&en) h+='<span class="en">'+esc(en)+'</span>';
        h+='</li>';
      });
      h+='</ul>';
    }
    if(c.notes) h+='<div class="kh3">'+dual('我的笔记','My notes')+'</div><div class="kbox">'+esc(c.notes)+'</div>';
    h+='<div class="kacts">'+
       '<button class="pri" data-back2="1">'+dual('← 返回知识卡目录','← Back to notes index')+'</button>'+
       '</div>';
    h+='<div class="kdb">'+dual(
      '知识卡内容源：src/build_knowledge.py + src/knowledge_sense.py（改后重新生成即可）',
      'Notes source: src/build_knowledge.py + src/knowledge_sense.py')+'</div>';
    return h;
  }

  function knListHtml(){
    var q=dView.q.trim().toLowerCase();
    var h='<div class="dsub">'+
      '<input type="search" id="dq" placeholder="'+(lang==='en'
        ? 'Search notes, e.g. smell / soundscape / colour' : '搜索知识卡，如 气味 / 声景 / 色彩')+
        '" value="'+esc(dView.q)+'">'+
      '<button data-only="1" class="'+(dView.onlySense?'on':'')+'">'+
        dual('只看多感官','Multisensory only')+'</button>'+
      '</div>';
    var byG={};
    KN_LIST.forEach(function(x){
      var g=GIX[x.gid]; if(!g) return;
      if(dView.onlySense && !SENSE_G[x.gid]) return;
      if(q){
        var c=KN[x.key]||{};
        var hay=(x.key+' '+(c.desc||'')+' '+(c.descEn||'')+' '+(c.why||'')+' '+(c.how||'')+' '+
          (c.watch||'')+' '+(c.ranges||[]).map(function(r){return r[0]+' '+r[1];}).join(' ')+' '+
          (c.rangesEn||[]).join(' ')+' '+g.zh+' '+(g.en||'')).toLowerCase();
        if(hay.indexOf(q)<0) return;
      }
      (byG[x.gid]=byG[x.gid]||[]).push(x.key);
    });
    var any=false;
    G.forEach(function(g){
      var ks=byG[g.id]; if(!ks||!ks.length) return;
      any=true;
      var gi = SENSE_G[g.id] ? ' ★' : '';
      h+='<div class="kgl'+(dView.gid===g.id?' cur':'')+'">'+esc(g.zh)+gi+
         '<em>'+esc(g.en||'')+'</em>'+
         '<span style="float:right;font-weight:400;color:#8b95a1;font-size:11px">'+ks.length+'</span></div>';
      ks.forEach(function(k){
        var c=KN[k]||{};
        var one = lang==='en' ? (c.descEn||c.desc||'') : (c.desc||c.descEn||'');
        h+='<div class="kli" data-k="'+esc(k)+'"><b>'+dual(k,c.titleEn||'')+'</b>'+
           (one?'<em>'+esc(one.slice(0,62))+'…</em>':'')+'</div>';
      });
    });
    if(!any) h+='<div class="empty">'+dual('没有匹配的知识卡','No matching notes')+'</div>';
    return h;
  }

  function renderDrawer(){
    var dh=document.getElementById('dhead'), db=document.getElementById('dbody');
    if(!dOpen) return;
    var inCard = dView.mode==='card' && dView.key && KN[dView.key];
    dh.innerHTML='<h3>'+dual('环境因子知识卡','Environmental Factor Notes')+
      '<em>'+KN_LIST.length+'</em></h3>'+
      (inCard?'<button id="dback">'+dual('← 知识卡目录','← Notes index')+'</button>':'')+
      '<span class="cn">'+(inCard
        ?(lang==='en'?'Esc closes':'按 Esc 关闭')
        :(lang==='en'?'Click a factor to read':'点因子查看知识'))+'</span>'+
      '<button id="dclose">'+dual('关闭','Close')+'</button>';
    db.innerHTML = inCard ? knCardHtml(dView.key) : knListHtml();
    document.getElementById('dclose').onclick=closeDrawer;
    var bk=document.getElementById('dback');
    if(bk) bk.onclick=backToList;
    var b2=db.querySelector('[data-back2]');
    if(b2) b2.onclick=backToList;
    var o=db.querySelector('button[data-only]');
    if(o) o.onclick=function(){ dView.onlySense=!dView.onlySense; renderDrawer(); };
    var qi=document.getElementById('dq');
    if(qi){
      qi.oninput=function(){ dView.q=this.value; renderDrawer();
        var n=document.getElementById('dq'); if(n){ n.focus();
          n.setSelectionRange(n.value.length,n.value.length); } };
    }
    db.querySelectorAll('.kli').forEach(function(el){
      el.onclick=function(){ openCard(el.getAttribute('data-k')); };
    });
    // 列表态：滚动到当前卡所属大类
    if(!inCard && dView.gid){
      var cur=db.querySelector('.kgl.cur');
      if(cur) db.scrollTop=Math.max(0, cur.offsetTop - db.offsetTop - 12);
    }
  }
  function backToList(){
    // 返回目录时记住当前卡所属大类，便于定位
    var k=dView.key;
    if(k && KN2G[k] && KN2G[k].length) dView.gid=KN2G[k][0].id;
    dView.mode='list'; dView.key=null; renderDrawer();
  }
  function openDrawer(gid,key){
    dOpen=true;
    if(gid!==undefined) dView.gid=gid||null;
    if(key){ dView.mode='card'; dView.key=key; }
    else { dView.mode='list'; dView.key=null; }
    document.getElementById('drawer').classList.add('on');
    document.getElementById('mask').classList.add('on');
    document.getElementById('dbody').scrollTop=0;   // 先归零，再渲染（渲染内可能按大类定位）
    renderDrawer();
  }
  function openCard(key){ dView.mode='card'; dView.key=key; renderDrawer();
    document.getElementById('dbody').scrollTop=0; }
  function closeDrawer(){
    dOpen=false;
    document.getElementById('drawer').classList.remove('on');
    document.getElementById('mask').classList.remove('on');
  }

  /* ==================== 事件 ==================== */
  document.getElementById('main').addEventListener('click',function(e){
    // 编辑模式：删除某个关联因子
    var dl=e.target.closest('.x[data-del]');
    if(dl){ e.stopPropagation();
      var cid=dl.getAttribute('data-cid'), kd=dl.getAttribute('data-del'), fd=dl.getAttribute('data-fid');
      var cc=CIX[cid];
      if(cc){
        var arr=(kd==='s'?cc.stressors:cc.envGroups);
        var ii=arr.indexOf(fd); if(ii>=0) arr.splice(ii,1);
        touch(cid); rebuildAfterEdit(); render();
      }
      return; }
    // 编辑模式：展开 / 收起候选面板
    var ao=e.target.closest('[data-add-open]');
    if(ao){ e.stopPropagation();
      var k2=ao.getAttribute('data-add-open'), cid2=ao.getAttribute('data-cid');
      if(k2==='close'||(addOpen&&addOpen.cid===cid2&&addOpen.kind===k2)) addOpen=null;
      else addOpen={cid:cid2,kind:k2};
      render(); return; }
    // 编辑模式：点候选因子即添加
    var ab=e.target.closest('.pkb[data-add]');
    if(ab){ e.stopPropagation();
      var cid3=ab.getAttribute('data-cid'), k3=ab.getAttribute('data-add'), f3=ab.getAttribute('data-fid');
      var c3=CIX[cid3];
      if(c3){
        var arr3=(k3==='s'?c3.stressors:c3.envGroups);
        if(arr3.indexOf(f3)<0) arr3.push(f3);
        touch(cid3); rebuildAfterEdit(); render();
      }
      return; }
    // 空间矩阵 ↔ 措施大类：点措施跳到措施页
    var gm=e.target.closest('[data-gom]');
    if(gm){ tab='measure'; sel.m={}; sel.m[gm.getAttribute('data-gom')]=1; mxHL=null; objLock=null; mxObj=null; render(); return; }
    // ============ 空间矩阵编辑（仅编辑模式下这些控件才被渲染出来）============
    // 每个对象的参数改动记录（懒建）
    function paramEdit(oid){
      if(!MX.params[oid]){
        var o=MOIX[oid];
        MX.params[oid]={rt:(o.runtime||[]).slice(), dz:(o.design||[]).slice(), add:[], del:[]};
      }
      var e=MX.params[oid];
      e.rt=e.rt||[]; e.dz=e.dz||[]; e.add=e.add||[]; e.del=e.del||[];
      return e;
    }
    // 删除参数
    var mdp=e.target.closest('[data-mxdelp]');
    if(mdp){ e.stopPropagation();
      var oidP=mdp.getAttribute('data-oid'), pP=mdp.getAttribute('data-mxdelp');
      if(MOIX[oidP]){
        var ep=paramEdit(oidP);
        var ai=(ep.add||[]).indexOf(pP);
        if(ai>=0){ ep.add.splice(ai,1); }              // 之前是新增的 → 撤销新增
        else { if(ep.del.indexOf(pP)<0) ep.del.push(pP); }
        ep.rt=ep.rt.filter(function(x){return x!==pP;});
        ep.dz=ep.dz.filter(function(x){return x!==pP;});
        saveMatrixEdit(); applyMatrixAndRender();
      }
      return; }
    // 切换可调性（运行中可调 ↔ 设计期定死）
    var mtg=e.target.closest('[data-mxtog]');
    if(mtg){ e.stopPropagation();
      var oidT=mtg.getAttribute('data-oid'), pT=mtg.getAttribute('data-mxtog');
      var oT=MOIX[oidT];
      if(oT){
        var et=paramEdit(oidT);
        var wasRt=(et.rt||[]).indexOf(pT)>=0;
        et.rt=et.rt.filter(function(x){return x!==pT;});
        et.dz=et.dz.filter(function(x){return x!==pT;});
        if(wasRt) et.dz.push(pT); else et.rt.push(pT);
        // 同步搬动内置基线，否则 applyMatrixEdit 会按 RT_SET0 回退回去
        var sT=MX_SNAP[oidT];
        if(sT){
          sT.rt=(sT.rt||[]).filter(function(x){return x!==pT;});
          sT.dz=(sT.dz||[]).filter(function(x){return x!==pT;});
          if(wasRt) sT.dz.push(pT); else sT.rt.push(pT);
        }
        saveMatrixEdit(); applyMatrixAndRender();
      }
      return; }
    // 解除「措施 ↔ 对象」映射
    var mdm=e.target.closest('[data-mxdelm]');
    if(mdm){ e.stopPropagation();
      var oidM=mdm.getAttribute('data-oid'), midM=mdm.getAttribute('data-mxdelm');
      var swM=MX.measSw[midM] || (MX.measSw[midM]={add:[],del:[]});
      swM.add=swM.add||[]; swM.del=swM.del||[];
      var xi2=swM.add.indexOf(oidM);
      if(xi2>=0) swM.add.splice(xi2,1);                        // 之前是新增的 → 撤销新增
      else if(swM.del.indexOf(oidM)<0) swM.del.push(oidM);
      saveMatrixEdit(); applyMatrixAndRender();
      return; }
    // 展开 / 收起矩阵候选面板
    var mo=e.target.closest('[data-mxopen]');
    if(mo){ e.stopPropagation();
      var kO=mo.getAttribute('data-mxopen'), oidO=mo.getAttribute('data-oid');
      if(kO==='close'||(mxOpen&&mxOpen.oid===oidO&&mxOpen.kind===kO)) mxOpen=null;
      else mxOpen={oid:oidO,kind:kO};
      render(); return; }
    // 点候选参数即添加
    var map=e.target.closest('[data-mxaddp]');
    if(map){ e.stopPropagation();
      var oidA=map.getAttribute('data-oid'), pA=map.getAttribute('data-mxaddp');
      addMatrixParam(oidA,pA); return; }
    // 点候选措施即添加
    var mam=e.target.closest('[data-mxaddm]');
    if(mam){ e.stopPropagation();
      var oidA2=mam.getAttribute('data-oid'), midA=mam.getAttribute('data-mxaddm');
      var swA=MX.measSw[midA] || (MX.measSw[midA]={add:[],del:[]});
      swA.add=swA.add||[]; swA.del=swA.del||[];
      var di2=swA.del.indexOf(oidA2);
      if(di2>=0) swA.del.splice(di2,1);                        // 之前是删除的 → 撤销删除
      else if(swA.add.indexOf(oidA2)<0) swA.add.push(oidA2);
      saveMatrixEdit(); applyMatrixAndRender();
      return; }
    // 输入新参数后点「加入」
    var mnp=e.target.closest('[data-mxnewp]');
    if(mnp){ e.stopPropagation();
      var oidN=mnp.getAttribute('data-oid');
      var inp=document.getElementById('mxnew');
      var v=inp?inp.value.trim():'';
      if(v){ addMatrixParam(oidN,v); } else { toast(lang==='en'?'Type a parameter name first':'请先输入参数名称'); }
      return; }
    // 空间矩阵 ↔ 案例：点案例数跳到案例页，并锁定这一批案例
    var gc=e.target.closest('[data-goc]');
    if(gc){ tab='case'; mxHL=null; setObjCases(gc.getAttribute('data-goc')); return; }
    // 措施 / 案例 → 空间矩阵：跳过去并高亮该行
    var gx=e.target.closest('[data-gomx]');
    if(gx){ tab='matrix'; mxHL=gx.getAttribute('data-gomx'); render();
      setTimeout(function(){
        var tr=document.querySelector('tr.mxhl');
        if(tr&&tr.scrollIntoView) tr.scrollIntoView({block:'center'});
      },0); return; }
    var qb=e.target.closest('.cqb[data-qf]');
    if(qb){
      var kf=qb.getAttribute('data-qf'), vf=qb.getAttribute('data-qv');
      if(qf[kf][vf]) delete qf[kf][vf]; else qf[kf][vf]=1;
      render(); return;
    }
    // 清除「来自空间矩阵」的案例锁定
    var ul2=e.target.closest('[data-unlock]');
    if(ul2){ objLock=null; mxObj=null; render(); return; }
    var qc2=e.target.closest('#cqclr');
    if(qc2){
      qf={dim:{},book:{},region:{}};
      document.getElementById('q').value='';
      render(); return;
    }
    var qc=e.target.closest('#qclr');
    if(qc){ document.getElementById('q').value=''; render(); return; }
    var ki=e.target.closest('.knb-ico');
    if(ki){ e.stopPropagation(); openDrawer(ki.getAttribute('data-kn')); return; }
    // —— 「引导」二级面板与附注区（必须先于 .opt 判断，避免被误当选项点击）——
    var gclr=e.target.closest('[data-gclr]');
    if(gclr){ e.stopPropagation(); gsel={ch:{},sc:{}}; render(); return; }
    var gbtn=e.target.closest('[data-gopen]');
    if(gbtn){ e.stopPropagation(); gOpen=!gOpen; render(); return; }
    var nbtn=e.target.closest('[data-note]');
    if(nbtn){ e.stopPropagation(); noteOpen=!noteOpen; render(); return; }
    var gch=e.target.closest('.gc[data-gc]');
    if(gch){
      e.stopPropagation();
      var gk=gch.getAttribute('data-gc'), gv=gch.getAttribute('data-gk');
      var gbox = gk==='ch' ? gsel.ch : gsel.sc;
      if(gbox[gv]) delete gbox[gv]; else gbox[gv]=1;
      // 通道变化后，把已经「全部无据」的场景清掉，避免留下一个置灰却仍生效的条件
      var chs=Object.keys(gsel.ch);
      if(chs.length){
        Object.keys(gsel.sc).forEach(function(sk){
          var ok=false; chs.forEach(function(ck){ if(gOK(ck,sk)) ok=true; });
          if(!ok) delete gsel.sc[sk];
        });
      }
      render(); return;
    }
    var ik=e.target.closest('.kni.has');
    if(ik){ e.stopPropagation(); openDrawer(null, ik.getAttribute('data-knkey')); return; }
    var o=e.target.closest('.opt');
    if(o){ var d=o.getAttribute('data-d'), id=o.getAttribute('data-id');
      if(sel[d][id]) delete sel[d][id]; else sel[d][id]=1; render(); return; }
    var t=e.target.closest('.tabs button');
    if(t){ tab=t.getAttribute('data-t'); render(); return; }
    var ch=e.target.closest('.ch[data-f]');
    if(ch){ var f=ch.getAttribute('data-f'); fold[f]=!fold[f]; render(); return; }
    var mr=e.target.closest('.mrow');
    if(mr){ var mid=mr.getAttribute('data-mid'); tab='case';
      sel.m={}; sel.m[mid]=1; render(); return; }
    var cd=e.target.closest('.chip[data-cd]');
    if(cd){ var dd=cd.getAttribute('data-cd'), ci=cd.getAttribute('data-cid');
      if(dd==='gc') delete gsel.ch[ci];
      else if(dd==='gs') delete gsel.sc[ci];
      else delete sel[dd][ci];
      render(); return; }
  });
  document.getElementById('q').addEventListener('input',render);
  // 面包屑在 header 里、不在 #main 的委托范围内 —— 必须单独绑定，否则点 × 无法移除条件
  document.getElementById('crumb').addEventListener('click',function(e){
    var ul=e.target.closest('.chip[data-unlock]');
    if(ul){ objLock=null; mxObj=null; render(); return; }
    var cd=e.target.closest('.chip[data-cd]');
    if(!cd) return;
    var dd=cd.getAttribute('data-cd'), ci=cd.getAttribute('data-cid');
    if(dd==='gc') delete gsel.ch[ci];
    else if(dd==='gs') delete gsel.sc[ci];
    else delete sel[dd][ci];
    render();
  });
  // 案例查询框：与顶部搜索框共用同一个词，重建后恢复焦点与光标位置
  document.getElementById('main').addEventListener('input',function(e){

    var v=e.target.value, pos=e.target.selectionStart;

    render();
    var n=document.getElementById('cq');

  });
  document.getElementById('rel').addEventListener('change',render);
  document.getElementById('sub').addEventListener('change',render);
  document.getElementById('knsub').addEventListener('change',render);
  document.getElementById('clr').onclick=function(){
    sel={s:{},g:{},m:{},o:{}}; gsel={ch:{},sc:{}}; qf={dim:{},book:{},region:{}};
    objLock=null; mxObj=null; mxHL=null;
    var qi=document.getElementById('q'); if(qi) qi.value='';
    render(); };
  document.getElementById('knbtn').onclick=function(){
    if(dOpen && dView.mode==='list'){ closeDrawer(); } else { openDrawer(null,null); }
  };
  document.getElementById('mask').onclick=closeDrawer;

  /* ==================== 编辑模式：导出 / 导入 / 还原 ==================== */
  function exportEdit(){
    var o={_说明:'三维筛选 · 案例关联因子编辑结果。stressors = 气候胁迫因子 id；env = 基础环境因子大类 id。'+
              '把本文件发回给内容负责人，即可合并进 CASE_STRESSOR / CASE_ENV 表。',
           _导出时间:new Date().toISOString(), _案例数:C.length, cases:{}};
    C.forEach(function(c){
      o.cases[c.name]={stressors:(c.stressors||[]).slice(), env:(c.envGroups||[]).slice()};
    });
    var blob=new Blob([JSON.stringify(o,null,2)],{type:'application/json'});
    var a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='case-links-'+new Date().toISOString().slice(0,10)+'.json';
    a.click(); URL.revokeObjectURL(a.href);
    toast(lang==='en'?'Exported '+C.length+' cases':'已导出 '+C.length+' 个案例的关联');
  }
  function importEdit(file){
    var r=new FileReader();
    r.onload=function(){
      try{
        var o=JSON.parse(r.result);
        var cs=o.cases||o, n=0;
        for(var nm in cs){
          if(nm.charAt(0)==='_') continue;
          var c=C.filter(function(x){return x.name===nm;})[0];
          if(!c) continue;
          var v=cs[nm];
          var ss=Array.isArray(v)?v:(v.stressors||null);
          var gg=Array.isArray(v)?null:(v.env||null);
          if(ss) c.stressors=ss.slice();
          if(gg) c.envGroups=gg.slice();
          EDIT[c.id]={s:(c.stressors||[]).slice(), g:(c.envGroups||[]).slice()};
          n++;
        }
        saveEdit(); rebuildAfterEdit(); render();
        toast(lang==='en'?'Imported '+n+' cases':'已导入 '+n+' 个案例的关联');
      }catch(err){ toast(lang==='en'?'Invalid JSON file':'JSON 文件格式不正确'); }
    };
    r.readAsText(file,'utf-8');
  }
  function resetEdit(){
    if(!confirm(lang==='en'
      ? 'Discard all local edits and restore the built-in links?'
      : '放弃所有本机修改，还原为内置关联？')) return;
    EDIT={}; addOpen=null;
    try{ localStorage.removeItem(EDIT_KEY); }catch(e){}
    C.forEach(function(c){ var o=ORIG[c.id]; if(o){ c.stressors=o.s.slice(); c.envGroups=o.g.slice(); } });
    rebuildAfterEdit(); render();
    toast(lang==='en'?'Restored to built-in links':'已还原为内置关联');
  }

  /* ---- 空间矩阵编辑：导出 / 导入 / 还原 ---- */
  function exportMatrix(){
    // 导出为「可直接覆盖回源表」的形态：每个对象的参数 + 可调性 + 措施映射
    var o={_说明:'三维筛选 · 空间矩阵编辑结果。params[对象] 给出该对象最终的参数清单与可调性 '+
                '(rt=运行中可调 / dz=设计期定死)；measures[对象] 给出最终的措施大类映射。'+
                '把本文件发回给内容负责人，即可合并回 MEASURE_TO_OBJ 与参数可调性表。',
           _导出时间:new Date().toISOString(), _对象数:MO.length,
           params:{}, measures:{}};
    MO.forEach(function(x){
      o.params[x.id]={params:x.params.slice(), rt:x.runtime.slice(), dz:x.design.slice()};
      o.measures[x.id]=x.measures.slice();
    });
    var blob=new Blob([JSON.stringify(o,null,2)],{type:'application/json'});
    var a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='matrix-edits-'+new Date().toISOString().slice(0,10)+'.json';
    a.click(); URL.revokeObjectURL(a.href);
    toast(lang==='en'?'Exported the matrix ('+MO.length+' objects)':'已导出矩阵（'+MO.length+' 个对象）');
  }
  function importMatrix(file){
    var r=new FileReader();
    r.onload=function(){
      try{
        var o=JSON.parse(r.result), n=0;
        // 新格式：{params:{oid:{params,rt,dz}}, measures:{oid:[mid]}}
        if(o.params||o.measures){
          MX.params={}; MX.objMeas={};
          for(var oid in (o.params||{})){
            if(!MOIX[oid]) continue;
            var v=o.params[oid];
            MX.params[oid]={rt:(v.rt||[]).slice(), dz:(v.dz||[]).slice(),
                            add:(v.params||[]).slice(), del:MX_SNAP[oid].params.slice()};
            n++;
          }
          for(var oid2 in (o.measures||{})){
            if(!MOIX[oid2]) continue;
            MX.objMeas[oid2]=(o.measures[oid2]||[]).slice();
          }
          MX.measSw={};
        } else {
          toast(lang==='en'?'Unrecognised matrix file':'无法识别的矩阵文件');
          return;
        }
        saveMatrixEdit(); applyMatrixAndRender();
        toast(lang==='en'?'Imported '+n+' objects':'已导入 '+n+' 个对象的矩阵改动');
      }catch(err){ toast(lang==='en'?'Invalid JSON file':'JSON 文件格式不正确'); }
    };
    r.readAsText(file,'utf-8');
  }
  function resetMatrix(){
    if(!confirm(lang==='en'
      ? 'Discard all matrix edits and restore the built-in matrix?'
      : '放弃所有矩阵修改，还原为内置矩阵？')) return;
    MX={}; mxOpen=null;
    try{ localStorage.removeItem(MX_KEY); }catch(e){}
    MO.forEach(function(o){
      o.params=o._baseParams.slice();
      o.paramsEn=o.params.map(function(p){ return PARAM_EN_ALL[p]||p; });
      o.measures=o._baseMeas.slice();
      o.n_measure=o.measures.length;
      o.runtime=o.params.filter(function(p){ return RT_SET0[p]; });
      o.design=o.params.filter(function(p){ return !RT_SET0[p]; });
      o.n_param=o.params.length; o.n_runtime=o.runtime.length; o.n_design=o.design.length;
      var cids=[];
      o.measures.forEach(function(mid){ var g=MGIX[mid]; if(!g) return;
        (g.cases||[]).forEach(function(cid){ if(cids.indexOf(cid)<0) cids.push(cid); }); });
      o.cases=cids; o.n_case=cids.length;
      var f={};
      cids.forEach(function(cid){ var c=CIX[cid]; if(!c) return;
        (c.stressors||[]).forEach(function(s){ f[s]=(f[s]||0)+1; }); });
      o.stressors=Object.keys(f).map(function(k){ return [k,f[k]]; }).sort(function(a,b){ return b[1]-a[1]; });
    });
    applyMatrixAndRender();
    toast(lang==='en'?'Restored to the built-in matrix':'已还原为内置矩阵');
  }
  document.getElementById('edm').onclick=function(){
    editMode=!editMode; addOpen=null; mxOpen=null; render();
    if(editMode) toast(lang==='en'
      ? 'Edit mode on — edit case links and the spatial matrix'
      : '编辑模式已开：可改案例关联，也可改空间矩阵');
  };
  document.getElementById('efile').addEventListener('change',function(e){
    var f=e.target.files[0]; if(f) importEdit(f);
    e.target.value='';
  });
  document.getElementById('mfile').addEventListener('change',function(e){
    var f=e.target.files[0]; if(f) importMatrix(f);
    e.target.value='';
  });
  document.addEventListener('keydown',function(e){
    if(e.key!=='Escape') return;
    if(mxOpen){ mxOpen=null; render(); return; }
    if(addOpen){ addOpen=null; render(); return; }
    closeDrawer();
  });

  function preset(p){
    ['s','g','m'].forEach(function(k){
      document.getElementById('p-'+k).classList.toggle('on', k===p); });
    // 第 4 维（空间对象）始终跟在这三列之后
    order = p==='s' ? ['s','g','m','o'] : p==='m' ? ['m','s','g','o'] : ['g','s','m','o'];
    render();
  }
  document.getElementById('p-s').onclick=function(){preset('s');};
  document.getElementById('p-m').onclick=function(){preset('m');};
  document.getElementById('p-g').onclick=function(){preset('g');};
  document.getElementById('foldb').onclick=function(){
    foldFilters=!foldFilters; render();
    toast(foldFilters
      ? (lang==='en'?'Filters hidden — use ▶ Show filters to bring them back'
                    :'筛选栏已收起，点「▶ 展开筛选」随时展开')
      : (lang==='en'?'Filters shown':'筛选栏已展开'));
  };

  // 语言切换
  Array.prototype.forEach.call(document.querySelectorAll('.langs button'),function(b){
    b.onclick=function(){
      lang=b.getAttribute('data-lang');
      Array.prototype.forEach.call(document.querySelectorAll('.langs button'),function(x){
        x.classList.toggle('on', x===b); });
      render();
      if(dOpen) renderDrawer();
    };
  });

  render();
})();
</script>
</body>
</html>
